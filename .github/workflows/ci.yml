name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (capture + verify + postprocess + dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[verify,postprocess,dev]"

      - name: Lint (ruff — correctness rules from pyproject.toml)
        run: ruff check .

      - name: Byte-compile every script
        run: python -m compileall -q bin evidence_capture verify postprocess run/web-server

      - name: Console entry point resolves
        run: evcap --help

      - name: Unit tests
        run: pytest

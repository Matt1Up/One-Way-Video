<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Live URL Overlay</title>
  <!-- ALLOW WEBSOCKETS -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' data: blob:; connect-src 'self' ws:; style-src 'self' 'unsafe-inline';">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="overlay" class="stack">
    <div id="status" aria-live="polite"></div>
    <div id="title" class="row"></div>
    <div id="source" class="row"></div>
    <div id="page" class="row"></div>
  </div>
  <script src="overlay.js"></script>
</body>
</html>
